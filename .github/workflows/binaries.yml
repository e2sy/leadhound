name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build one-file binary
        run: pyinstaller --onefile --clean --name leadhound-${{ matrix.name }} entry.py

      - name: Smoke test the binary (linux + macos)
        if: matrix.name != 'windows-x64'
        env:
          LEADHOUND_HOME: ${{ runner.temp }}/lh-home
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          BIN=./dist/leadhound-${{ matrix.name }}
          "$BIN" --help
          "$BIN" init
          "$BIN" doctor --offline
          "$BIN" demo
          "$BIN" queue --list
          "$BIN" show 1
          "$BIN" mark 1 replied
          "$BIN" stats
          "$BIN" export --format csv
          "$BIN" digest
          echo "SMOKE OK"

      - name: Smoke test the binary (windows)
        if: matrix.name == 'windows-x64'
        env:
          LEADHOUND_HOME: ${{ runner.temp }}\lh-home
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $BIN = "./dist/leadhound-windows-x64.exe"
          & $BIN --help
          & $BIN init
          & $BIN doctor --offline
          & $BIN demo
          & $BIN queue --list
          & $BIN show 1
          & $BIN mark 1 replied
          & $BIN stats
          & $BIN export --format csv
          & $BIN digest
          Write-Host "SMOKE OK"

      - name: Launch test — no args = app (linux + macos)
        if: matrix.name != 'windows-x64'
        env:
          LEADHOUND_HOME: ${{ runner.temp }}/lh-launch
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LEADHOUND_HOME"
          BIN=./dist/leadhound-${{ matrix.name }}
          "$BIN" >/tmp/lh-launch.log 2>&1 &
          PID=$!
          UP=0
          STATE=""
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:7800/api/state >/dev/null 2>&1; then UP=1; break; fi
            sleep 1
          done
          if [ "$UP" = "1" ]; then STATE=$(curl -sf http://127.0.0.1:7800/api/state || true); fi
          kill $PID 2>/dev/null || true
          if [ "$UP" != "1" ]; then echo "dashboard never came up"; tail -20 /tmp/lh-launch.log; exit 1; fi
          echo "$STATE" | grep -q '"demo": true'
          echo "LAUNCH OK (auto-init + demo seed + dashboard)"

      - name: Launch test — no args = app (windows)
        if: matrix.name == 'windows-x64'
        env:
          LEADHOUND_HOME: ${{ runner.temp }}\lh-launch
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:LEADHOUND_HOME) { Remove-Item -Recurse -Force $env:LEADHOUND_HOME }
          $BIN = "./dist/leadhound-windows-x64.exe"
          $p = Start-Process -FilePath $BIN -PassThru -RedirectStandardOutput "lh-launch.log"
          $up = $false
          foreach ($i in 1..25) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:7800/api/state" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $up = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $up) {
            Write-Host "dashboard never came up"
            if (Test-Path "lh-launch.log") { Get-Content "lh-launch.log" -Tail 20 }
            exit 1
          }
          $state = (Invoke-WebRequest -Uri "http://127.0.0.1:7800/api/state" -UseBasicParsing).Content
          if ($state -notmatch '"demo":\s*true') { exit 1 }
          Write-Host "LAUNCH OK (auto-init + demo seed + dashboard)"

      - name: Upload workflow artifact (always, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: leadhound-${{ matrix.name }}
          path: dist/leadhound-*
          retention-days: 14

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: dist/leadhound-*
