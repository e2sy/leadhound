name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build one-file binary
        run: pyinstaller --onefile --clean --name leadhound-${{ matrix.name }} entry.py

      - name: Smoke test the binary (linux + macos)
        if: matrix.name != 'windows-x64'
        env:
          LEADHOUND_HOME: ${{ runner.temp }}/lh-home
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          BIN=./dist/leadhound-${{ matrix.name }}
          "$BIN" --help
          "$BIN" init
          "$BIN" doctor --offline
          "$BIN" demo
          "$BIN" queue --list
          "$BIN" show 1
          "$BIN" mark 1 replied
          "$BIN" stats
          "$BIN" export --format csv
          "$BIN" digest
          echo "SMOKE OK"

      - name: Smoke test the binary (windows)
        if: matrix.name == 'windows-x64'
        env:
          LEADHOUND_HOME: ${{ runner.temp }}\lh-home
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $BIN = "./dist/leadhound-windows-x64.exe"
          & $BIN --help
          & $BIN init
          & $BIN doctor --offline
          & $BIN demo
          & $BIN queue --list
          & $BIN show 1
          & $BIN mark 1 replied
          & $BIN stats
          & $BIN export --format csv
          & $BIN digest
          Write-Host "SMOKE OK"

      - name: Upload workflow artifact (always, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: leadhound-${{ matrix.name }}
          path: dist/leadhound-*
          retention-days: 14

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: dist/leadhound-*
