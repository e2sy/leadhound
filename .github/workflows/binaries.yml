name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build one-file binary
        run: pyinstaller --onefile --clean --name leadhound-${{ matrix.name }} leadhound/__main__.py

      - name: Smoke test the binary (linux only)
        if: matrix.name == 'linux-x64'
        run: ./dist/leadhound-linux-x64 --help

      - name: Upload workflow artifact (always, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: leadhound-${{ matrix.name }}
          path: dist/leadhound-*
          retention-days: 14

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: dist/leadhound-*
